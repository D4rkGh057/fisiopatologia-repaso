<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fisiopatología - Repaso</title>
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="styles.css">
<!-- Apply the theme before the first paint so nothing flashes from dark to light. -->
<script>
  try {
    var t = localStorage.getItem("fisio-theme");
    document.documentElement.dataset.theme = (t === "light" || t === "dark") ? t
      : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  } catch (e) { document.documentElement.dataset.theme = "dark"; }
</script>
</head>
<body>
<main>
  <header class="topbar">
    <div>
      <h1><a href="#" id="home-link">Fisiopatología: repaso del hemiparcial</a></h1>
      <p class="sub">Basado en el libro de Galo Vinueza Aguay.</p>
    </div>
    <button class="btn theme-toggle" id="theme-toggle" type="button" aria-pressed="false">Modo claro</button>
  </header>
  <section id="view" class="card" aria-live="polite"></section>
</main>

<!-- One file per chapter. To add a chapter, create data/capNN.js and add its script tag here. -->
<script src="data/cap20.js"></script>
<script src="data/cap21.js"></script>
<script src="data/cap22.js"></script>
<script src="data/cap23.js"></script>
<script src="data/cap24.js"></script>
<script src="data/cap25.js"></script>
<script src="data/cap32.js"></script>
<script src="data/cap33.js"></script>
<script src="data/cap34.js"></script>
<script src="data/cap35.js"></script>
<script src="data/cap36.js"></script>
<script src="data/cap37.js"></script>
<script src="app.js"></script>
</body>
</html>
